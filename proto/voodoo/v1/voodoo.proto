syntax = "proto3";

package voodoo.v1;

option go_package = "voodoo-case-study/gen/voodoo/v1";

// VoodooService is the gateway layer: all incoming gRPC requests are described here.
// The router dispatches each RPC to its dedicated worker.
service VoodooService {
  rpc Health(HealthRequest) returns (HealthResponse);
  rpc CreateGame(CreateGameRequest) returns (CreateGameResponse);
  rpc JoinGame(JoinGameRequest) returns (JoinGameResponse);
  rpc UpdateGame(UpdateGameRequest) returns (UpdateGameResponse);
  rpc ListPendingGames(ListPendingGamesRequest) returns (ListPendingGamesResponse);
  rpc GetPlayerStats(GetPlayerStatsRequest) returns (GetPlayerStatsResponse);
}

message HealthRequest {}
message HealthResponse { string status = 1; }

message GridConfig {
  int32 width = 1;          // number of columns
  int32 height = 2;         // number of rows
  int32 winning_length = 3; // consecutive marks needed to win
}

message CreateGameRequest {
  string player_id = 1;
  GridConfig grid = 2; // omit for default 3×3 with winning length 3
}
message CreateGameResponse { string game_id = 1; }

message JoinGameRequest {
  string game_id = 1;
  string player_id = 2;
}
message JoinGameResponse { string game_id = 1; }

message UpdateGameRequest {
  string game_id = 1;
  string player_id = 2;
  int32 cell = 3; // 0-8, row-major order
}
message UpdateGameResponse {
  string game_id = 1;
  repeated string board = 2; // 9 cells: "" empty, player_id if marked
  string winner = 3;         // "" ongoing, player_id if won, "draw"
}

message ListPendingGamesRequest {}
message ListPendingGamesResponse { repeated string game_ids = 1; }

message GetPlayerStatsRequest { string player_id = 1; }
message GetPlayerStatsResponse {
  int64 wins   = 1;
  int64 losses = 2;
  int64 draws  = 3;
}
